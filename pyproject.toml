[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demeter-vision-sdk"
version = "0.1.0"
description = "Local setup, training, and inspection SDK for Demeter vision systems"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "numpy>=1.24,<3", "opencv-python>=4.8,<5", "pyserial>=3.5,<4"]

[project.optional-dependencies]
train = ["torch>=2,<3", "ultralytics>=8,<10", "onnx>=1.16,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
# The packaged desktop runtime. onnxruntime here is the CPU build; the Windows
# build swaps in onnxruntime-directml, which provides the same module name.
runtime = ["pymodbus==3.15.0", "onnxruntime>=1.17,<2"]

[project.scripts]
demeter-vision = "vision_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vision_sdk*", "backend*"]
namespaces = true

[tool.setuptools.package-data]
vision_sdk = [
    "static/*",
    "vendor_compile_worker.py",
    "board_runtime/*.py",
    "preprocessing/Preprocessing_Fixed_Reference/*",
]
